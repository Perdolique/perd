name: Build and Deploy

permissions:
  contents: read
  pull-requests: write

on:
  pull_request:
    branches:
      - master

    types:
      - opened
      - synchronize

  push:
    branches:
      - master

concurrency:
  group: build-and-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Format
    runs-on: ubuntu-24.04
    steps:
      - uses: Perdolique/automations/.github/actions/setup-pnpm@v4
        with:
          install-dependencies: true
      - run: pnpm run format:check

  integration:
    name: Database integration
    needs: format
    runs-on: ubuntu-24.04
    steps:
      - uses: Perdolique/automations/.github/actions/setup-pnpm@v4
        with:
          install-dependencies: true
      - name: Start local database and Neon proxy
        run: docker compose up --detach --wait
      - name: Build test Worker
        run: pnpm run build:e2e
      - name: Test catalog and private gear in PostgreSQL and the Worker
        run: pnpm run test:integration tests/integration/category-properties.test.ts tests/integration/category-properties-worker.test.ts tests/integration/equipment-item-edit.test.ts tests/integration/equipment-item-edit-worker.test.ts tests/integration/custom-gear-worker.test.ts
      - name: Remove local database and Neon proxy
        if: always()
        run: docker compose down --volumes

  migration:
    name: Database migration
    needs: integration
    runs-on: ubuntu-24.04
    environment: ${{ github.event_name == 'pull_request' && 'staging' || 'production' }}
    steps:
      - uses: Perdolique/automations/.github/actions/setup-pnpm@v4
        with:
          install-dependencies: true
      - name: Run database migration
        env:
          NUXT_DATABASE_URL: ${{ secrets.NUXT_DATABASE_URL }}
        run: pnpm run db:migrate

  deploy:
    needs: migration
    uses: Perdolique/automations/.github/workflows/deploy.yml@v4

    with:
      test-typecheck-command: test:typecheck
      lint-markdown-command: lint:markdown
      lint-oxlint-command: lint:oxlint
      test-unit-command: test:unit:ci
      test-e2e-command: test:e2e:ci
      playwright-browsers: chromium webkit
      deploy-to-staging-command: deploy:staging
      deploy-to-production-command: deploy:production

    secrets:
      cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
